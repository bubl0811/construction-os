name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest
      - name: Validate staging deployment files
        run: |
          bash -n scripts/deploy.sh
          cp .env.example .env
          CONSTRUCTION_OS_POSTGRES_DB=construction \
          CONSTRUCTION_OS_POSTGRES_USER=construction \
          CONSTRUCTION_OS_POSTGRES_PASSWORD=validation-only \
            docker compose -f compose.staging.yaml config >/dev/null

name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/deploy-trigger

concurrency:
  group: construction-os-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_HOST: 185.143.145.25
      SERVER_USER: root
      SSHPASS: ${{ secrets.CONSTRUCTION_OS_SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secret
        run: |
          if [ -z "${SSHPASS}" ]; then
            echo "Repository secret CONSTRUCTION_OS_SERVER_PASSWORD is required." >&2
            exit 1
          fi

      - name: Install SSH client helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Package application
        run: tar --exclude=.git --exclude=.env -czf /tmp/construction-os.tar.gz .

      - name: Upload release
        run: |
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          SSH_OPTIONS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          sshpass -e ssh ${SSH_OPTIONS} "${SERVER_USER}@${SERVER_HOST}" \
            "install -d -m 755 /opt/construction-os"
          sshpass -e scp ${SSH_OPTIONS} /tmp/construction-os.tar.gz \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/construction-os.tar.gz"
          sshpass -e ssh ${SSH_OPTIONS} "${SERVER_USER}@${SERVER_HOST}" \
            "tar -xzf /tmp/construction-os.tar.gz -C /opt/construction-os && rm /tmp/construction-os.tar.gz"

      - name: Deploy and verify
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "chmod 755 /opt/construction-os/scripts/deploy.sh && /opt/construction-os/scripts/deploy.sh"

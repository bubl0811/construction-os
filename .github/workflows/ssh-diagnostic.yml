name: SSH connectivity diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ssh-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe server ports
        shell: bash
        run: |
          set -u
          host="185.143.145.25"
          ssh_open=""
          for port in 22 2222 2200 2022 22222 80 443 8000; do
            echo "Testing ${host}:${port}"
            if timeout 6 bash -c "exec 3<>/dev/tcp/${host}/${port}" 2>/dev/null; then
              echo "OPEN ${port}"
              case "${port}" in
                22|2222|2200|2022|22222) ssh_open="${port}" ;;
              esac
            else
              echo "CLOSED_OR_FILTERED ${port}"
            fi
          done
          if [ -z "${ssh_open}" ]; then
            echo "No reachable SSH port found."
            exit 1
          fi
